# models node
models:
  _target_: diffusion_policy.model.models.Models

  models:
    actor:
      _target_: diffusion_policy.model.model.ModelEmaOptim

      model:
        _target_: diffusion_policy.model.model.Model
        model:
          _target_: diffusion_policy.model.diffusion_model.DiffusionModel
          action_shape: ${shape_meta.action.shape}
          noise_scheduler: ${common_noise_scheduler}
          val_noise_scheduler: ${common_val_ddim_scheduler} # get_val_action_mse_error samples with THIS scheduler instead of noise_scheduler -- DDIM (eta=0 default) is deterministic given the initial noise draw, unlike DDPM's ancestral sampling which injects fresh stochastic noise at every reverse step; also actually applies num_inference_steps (below) via set_timesteps, which noise_scheduler's own path never did. Set to null to go back to sampling validation with noise_scheduler, unchanged from before.
          obs_encoder_maker: ${common_obs_encoder}
          eval_fixed_crop: true
          obs_as_global_cond: true
          obs_encoder_group_norm: true
          n_obs_steps: 1
          down_dims:
            - 256
            - 512
            - 1024
          diffusion_step_embed_dim: 32

          action_relative_to_state: ${action_relative_to_state}
          use_tree: false
          use_simple_model: false

          model_type: dexnex_transformer
          transformer_n_layer: 8 # (flask_17: the large model -- see the description)
          transformer_n_emb: 512
          transformer_n_cond_layers: 8
          transformer_n_head: 8
          diagnostics_every_n_steps: 50
          check_alignment_direction: true # log val_alignment_direction_cos_sim: does the predicted palm-xyz action point toward this episode's own final palm pose (a no-ground-truth-needed proxy for the true aligned position, via each sample's ep_id)? Adapts to action_pose_relative (see DiffusionModel's diagnostic block) -- unnormalizes+re-derives the implied delta when the action is absolute, so this stays meaningful either way. Requires no code changes to disable -- set false to skip it entirely.
          use_compiled_policy: ${use_compiled_policy} # torch.compile's the transformer trunk (see DiffusionModel._get_forward_model) -- watch the first ~50-100 steps for compile-time spikes/graph breaks (log_attn flips every diagnostics_every_n_steps, train/eval differ, and the model writes diagnostics attrs like last_keep_mask inside forward -- each a possible graph-break source) before trusting steady-state it/s.
          transformer_droppable_token_keys: ['palm_pose_xyz_rpy', 'gripper_value']
          transformer_p_drop_token: 0.0
          transformer_normalize_cond_tokens: true # LayerNorm each cond token right after its own projection, so timestep can't dominate cross-attention purely from raw embedding magnitude. In the future solve this problem using adaLN instead
          transformer_use_adaln_timestep: true # DiT-style AdaLN-Zero timestep conditioning instead of a timestep cross-attn token -- the more standard fix

          embed_task_id: true # gives the shared decoder an explicit, cheap task signal via the existing task_id_emb lookup table -- task_24 uses task_id 24, task_25 uses 25, the env-camera task uses 27 (see token_keys_valid_only_for_task_ids below)
          num_tasks: 28 # 0-25 for real task ids (task_24 uses 24, task_25 uses 25) + 27 (new real task_id with a valid env_cam_grid3x3_dinov3l) -- must cover the highest task_id actually used, not just count of distinct task ids (26 is unused now that sim's gone, harmless to still cover)

          # NOTE: no patch_keys_to_use/spatial_softmax_* here, unlike flask_6
          # -- wrist_cam_grid3x3_dinov3l/overhead_cam_grid3x3_dinov3l/
          # env_cam_grid3x3_dinov3l are precomputed (see obs_keys_to_use's
          # comment above), so they're plain lowdim obs keys routed through
          # obs_encoder/cond_dims like palm_pose_xyz_rpy, not raw patch grids
          # needing an in-model spatial-softmax reduction.

          # training-time Gaussian noise on cond_dims keys -- single data
          # source now (sim_alignment removed), so just one entry.
          gaussian_noise_by_data_source:
            0: ['palm_pose_xyz_rpy', 'gripper_value'] # 0=erlenmeyer (the only data source now)
          gaussian_noise_std: 0.0

          # no excluded_token_keys_by_data_source/num_data_sources needed --
          # single data source (erlenmeyer real). env_cam_grid3x3_dinov3l
          # is only genuinely present for task_id 27 -- every other task_id
          # zero-fills it, masked out (hard-zeroed + removed from attention)
          # via token_keys_valid_only_for_task_ids instead. See
          # DexNexTransformerForDiffusion.__init__'s docstring for the
          # mechanism.
          token_keys_valid_only_for_task_ids:
            env_cam_grid3x3_dinov3l: [27]

      ema:
        _target_: diffusion_policy.model.model.Ema
        use_ema: true
        ema_cfg:
          inv_gamma: 1.0
          max_value: 0.9999
          min_value: 0.0
          power: 0.75
          update_after_step: 0

      optim:
        _target_: diffusion_policy.model.model.Optim

        lr_scheduler: cosine
        lr_warmup_steps: 500
        gradient_accumulate_every: 1
        optimizer_target: torch.optim.AdamW
        optimizer_cfg:
          betas:
            - 0.95
            - 0.999
          eps: 1.0e-08
          lr: 1e-4
          weight_decay: 1.0e-06


common_noise_scheduler:
  _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  clip_sample: true
  # NOTE: flask_11-13's clip_sample_range: 6.0 was data-derived from the
  # RELATIVE-action (small delta) distribution -- meaningless here, since
  # absolute palm poses live on a completely different (much larger,
  # workspace-range) scale. Left at diffusers' default (1.0, i.e. clip to
  # the normalizer's own [-1,1] fit range) until an absolute-pose-specific
  # outlier analysis is done the same way flask_8's clip_sample_range was
  # derived (see that session's action-stats script).
  clip_sample_range: 6.0
  num_train_timesteps: 100
  prediction_type: epsilon # sample or epsilon

# used ONLY for get_val_action_mse_error (val_noise_scheduler above) -- same
# noise schedule/prediction_type as common_noise_scheduler (that part must
# match, since both interpret the SAME trained model's output), but DDIM's
# step() instead of DDPM's ancestral step(). eta defaults to 0.0 (fully
# deterministic reverse process given the initial noise draw) since it's not
# set here -- pass eta as a kwarg to .step() (via the model's existing kwargs
# passthrough) if you want partial stochasticity instead.
common_val_ddim_scheduler:
  _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  clip_sample: true
  num_train_timesteps: 100
  prediction_type: epsilon # MUST BE SAME AS DDPMSCHEDULER (common_noise_scheduler)

device: cuda:0

override:
  models:
    models:
      actor:
        model:
          model:
            noise_scheduler:
              variance_type: fixed_small
