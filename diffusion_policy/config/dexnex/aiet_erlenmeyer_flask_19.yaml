      rb_id: erlenmeyer_sim_lift
      train_or_val: val
      normalizer_fit_rb_ids: ${normalizer_fit_rb_ids}

# the aiet_grip layout + DR subset
common_wbatch_loss_erlenmeyer_sim_layout:
  _target_: diffusion_policy.losses.batch_loss.WeightedBatchLoss
  weight: 1.0

