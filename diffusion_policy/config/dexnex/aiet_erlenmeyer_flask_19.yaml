      rb_id: erlenmeyer_sim_layout
      train_or_val: train
      normalizer_fit_rb_ids: ${normalizer_fit_rb_ids}

# the aiet_grip layout + DR subset: its held-out val split (epoch_evaluator only)
common_wbatch_loss_erlenmeyer_sim_layout_val:
