      rb_id: erlenmeyer_sim_lift
      train_or_val: train
      normalizer_fit_rb_ids: ${normalizer_fit_rb_ids}

# the aiet_grip_lift sim stream (successes ending at the lift): its held-out val split (epoch_evaluator only)
common_wbatch_loss_erlenmeyer_sim_lift_val:
