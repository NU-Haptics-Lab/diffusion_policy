###################################################
###################################################
description: "aiet_erlenmeyer_flask_19: aiet_erlenmeyer_flask_17 (same streams, sampling, transformer, obs / action
  layout; trained from scratch) with the vision features swapped: the three fixed-tau spatial-softmax keypoint arrays
  (*_keypoints_dinov3l, 1024 x 2 each) -> DINOv3-L 3x3-grid features (*_grid3x3_dinov3l, 9 x 32 each: 7x fewer numbers),
  the pipeline dinov3_token_compression_probe.py picked (2026-11-10): the zarrs 224 x 224 frames upsampled to 448,
  DINOv3 ViT-L/16 patch tokens, a per-camera PCA to 32 channels (one basis over both zarrs), 3x3 average-pooled cells
  (diffusion_policy/scripts/add_dinov3_grid_features.py; its PCA .npz is needed at inference). The overhead camera is
  the full 224 frame (the probe found no gain from the ROI crop), the same frames for sim and real -- unlike flask_17s
  keypoints (real from native-resolution frames, sim from the 224 frames). Paths: data_root / model_root (override on
  the command line on dexbeast). Streams added on 2026-11-12, as openpi's views_layout_aux co-train did: erlenmeyer_sim
  cost-balanced (label_bins on data/start_cost, openpi's aiet_grip cost bins); erlenmeyer_sim_lift (aiet_grip_lift_sim_to_real.zarr,
  the sim successes ending at the lift, cost-balanced on its own bins); erlenmeyer_sim_fine_align /
  erlenmeyer_sim_lift_fine_align (only the fine-alignment frames of each sim zarr: label_bins on data/fine_align with
  the 0 bin's mass 0); erlenmeyer_aux (the real flush / corner demos, bags flush_corner_aux_1_toby onward, about 10% of
  each step). Also erlenmeyer_sim_layout / erlenmeyer_sim_lift_layout: random ~50k-frame subsets (whole episodes,
  subset_sim_zarr.py, seed 0) of the layout/ re-renders (table / tray moved, domain-randomized look on ~70% of episodes),
  cost-balanced like their nominal streams. The sim labels come from add_sim_frame_labels.py. Each stream's share is
  set by its batch size: real 645 of 1,285 (50%), sim 640 (50%; the full sim streams split by frame count)."

# global controls
debug: false
single_thread: false
use_compiled_policy: true
total_num_epochs: 5001 # can do about 3000 epochs overnight
batches_per_epoch: 100
val_every: 20

action_key: action # placeholder -- computed (palm pose + gripper_value), not a literal rb field, same as aiet_alignment_sim_3

# false: the action's palm-pose component is the raw ABSOLUTE future pose (no
# subtraction, no rpy-delta wrapping) instead of a delta from the
# observation's own current pose. See AIETAlignmentSim3Sampler's docstring
# (aiet_alignment_sim_3_sampler.py) for the full rationale/mechanics, and
# DiffusionModel's check_alignment_direction diagnostic block for how it
# adapts to either mode. Unchanged from flask_14/15.
action_pose_relative: false

# 'limits' -- see flask_14/15's comments for why gaussian mode badly
# overreacts to cos_yaw specifically. Unchanged.
action_normalizer_mode: limits

# true -- fits scale/offset from the 0.5th/99.5th percentile instead of the
# true min/max. Unchanged from flask_14/15, see normalizer.py's _fit
# (clip_outlier_percentile).
action_fit_clip_outliers: true

# true -- obs keys resolve to their _states-suffixed rb sibling instead of
# the default unsuffixed array, if that sibling actually exists. Unchanged
# from flask_15, see AIETErlenmeyerFlaskSampler.resolve_rb_key.
obs_use_states_suffix: true

# palm_pose_xyz_rpy_commands -- which literal rb array
# AIETAlignmentSim3Sampler reads for the action's palm-pose component
# (current AND future values) instead of the default palm_pose_xyz_rpy.
# Unchanged from flask_15, see AIETAlignmentSim3Sampler._action_palm_pose_rb_key.
action_palm_pose_rb_key: palm_pose_xyz_rpy_commands

# 14 or 7 -- not relevant here (vision obs keys are the precomputed keypoint
# arrays, not raw patch grids). Kept only because
# AIETErlenmeyerFlaskSampler.resolve_rb_key references it unconditionally.
patch_grid_size: 14

### Global Control Panel ###
to_load:
  - actor
  - globals

resume: false
resume_tag: null

# should be the same as this file's name (sans .yaml)
run_tag: aiet_erlenmeyer_flask_17

# (dexbeast: data_root=/home/dexbeast/datasets/diffusion model_root=/home/dexbeast/models on the command line)
data_root: /media/dexnex_ssd/datasets
model_root: /media/dexnex_ssd/models
output_dir: ${model_root}/aiet_erlenmeyer_flask_19

tasks_to_use:
  - erlenmeyer
  - erlenmeyer_align
  - erlenmeyer_fine_align
  - erlenmeyer_sim
  - erlenmeyer_sim_lift
  - erlenmeyer_sim_fine_align
  - erlenmeyer_sim_lift_fine_align
  - erlenmeyer_aux
  - erlenmeyer_sim_layout
  - erlenmeyer_sim_lift_layout

# every BatchLoader in this yaml (both streams' train+val loaders, AND
# default_batch_loader) passes this SAME list as normalizer_fit_rb_ids, so
# their normalizer stats are explicitly, deterministically pooled from both
# sources' data and shared across all of them -- rather than each fitting
# independently, or accidentally sharing based on class name + construction
# order (see BatchLoader.init_normalizers's docstring). This is what makes
# real-world inference (which only ever normalizes/unnormalizes through
# default_batch_loader) consistent with what every stream was actually
# trained against.
normalizer_fit_rb_ids: [erlenmeyer, erlenmeyer_align, erlenmeyer_fine_align, erlenmeyer_sim, erlenmeyer_sim_lift, erlenmeyer_sim_layout, erlenmeyer_sim_lift_layout]

# fused/single-vector keys routed through the obs_encoder. Vision: precomputed
# DINOv3-L 3x3-grid features (add_dinov3_grid_features.py), [9 cells, 32 PCA
# channels] per camera, plain lowdim obs keys (flattened by the per-key
# Linear, which fixes each cell's position). env_cam_grid3x3_dinov3l is only
# genuinely valid for task_id 27 (and the sim, stamped 27) -- masked out for
# every other task_id via the model's token_keys_valid_only_for_task_ids.
obs_keys_to_use:
  - palm_pose_xyz_rpy
  - gripper_value
  - wrist_cam_grid3x3_dinov3l
  - overhead_cam_grid3x3_dinov3l
  - env_cam_grid3x3_dinov3l

obs_keys_to_load:
  - palm_pose_xyz_rpy
  - wrist_cam_grid3x3_dinov3l
  - overhead_cam_grid3x3_dinov3l
  - env_cam_grid3x3_dinov3l
  - gripper_value

models_to_train:
  - actor

models_to_eval:
  - actor

step_freqs:
  actor: 1
  res_actor: 1
  critic: 1
  sac_actor: 1

use_bc_loss: true
action_relative_to_state: false
use_denoise: false
### End Global Control Panel ###

num_inference_steps: 25
clamp: false

