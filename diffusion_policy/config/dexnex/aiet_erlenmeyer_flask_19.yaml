# uniform sampling, same as flask_15.
common_dataset_erlenmeyer:
  _target_: diffusion_policy.dataset.train_and_val.TrainAndVal
  seed: 42
  val_ratio: 0.02
  split_val_by_episode: true # hold out whole episodes for val instead of scattered individual timesteps, since per-timestep splitting leaks trajectory-local info (overlapping action-horizon windows, and just smooth-trajectory continuity) across the train/val boundary
  max_train_episodes: null
  use_weighted_dataloader: false
  preload_to_gpu: true
  preload_vectorized: true


  use_gpu_sample_cache: false
  gpu_sample_cache_max_bytes: 1e+10
  gpu_sample_cache_evict: false

  options:
    common:
      batch_size: 250
      timeout: 0
    train:
      num_workers: 4
      persistent_workers: true
      pin_memory: true
      shuffle: true
    val:
      num_workers: 0
      persistent_workers: false
      pin_memory: false
      shuffle: true

  sampler:
    _target_: diffusion_policy.common.sarsa_sampler.DatasetSampler
    rb_id: erlenmeyer
    ep_sampler_class_str: diffusion_policy.samplers.aiet_erlenmeyer_flask_4_sampler.AIETErlenmeyerFlask4Real1Sampler
    # ONLY subtask_id==0 episodes -- episode_filter_value is an exact-equality
    # filter (DatasetSampler._compute_episode_filter_mask), so this
    # automatically excludes BOTH subtask 1 (covered entirely by
    # erlenmeyer_align below) AND subtask 2 (covered entirely by
    # erlenmeyer_fine_align below) with no extra logic needed. Originally
    # added to stop subtask_id==1 data being double-emphasized (upweighted
    # here via subtask_weights AND given its own dedicated stream), and to
    # fix val_action_variance_ratio's {rb_id}_subtask_1 breakdown not being
    # comparable between streams (this one's full-val-set denominator used
    # to mix in a different population than erlenmeyer_align's) -- excluding
    # non-zero subtasks here removes both problems at the root instead of
    # patching the denominator computation.
    episode_filter_key: subtask_id
    episode_filter_value: 0

