# globals
debug: true
horizon: 16

# common data
shape_meta:
  action:
    shape:
    - 21
  obs:
    lowdim_obs:
      shape:
      - 35
      type: low_dim
    image:
      shape:
      - 3
      - 192
      - 192
      type: rgb
    image2:
      shape:
      - 3
      - 192
      - 192
      type: rgb

common_policy:
  n_obs_steps: 1
  horizon: ${horizon}
  state_length: ${shape_meta.obs.lowdim_obs.shape}

common_dataset:
  _target_: diffusion_policy.dataset.sars.SARSDataset
  n_obs_steps : ${policy.n_obs_steps}
  horizon : ${horizon}
  state_length : ${policy.state_length}
  pad_after: 7 # afaik these are w.r.t. beginning's and ends of episodes
  pad_before: 1 # afaik these are w.r.t. beginning's and ends of episodes
  seed: 42
  val_ratio: 0.02
  history_indices: [15, 10, 5] # 0.5s skip, with 0.1s dt, get state from 1.5s, 1.0s, and 0.5s ago
  max_train_episodes: null
  shape_meta: ${shape_meta}

  # child
  sampler:
    _target_: diffusion_policy.common.sars_sampler.DatasetSampler
    rb_id: "default"

    # child

  
common_wbatch_loss:
  _target_: diffusion_policy.losses.batch_loss.WeightedBatchLoss
  weight: 1.0

  # children
  batch_loss:
    _target_: diffusion_policy.losses.batch_loss.BatchLoss

    # children
    batch_loader:
      _target_: diffusion_policy.dataset.batch_loader.BatchLoader

      # children
      dataset: 
        ${common_dataset}


common_indices:
  _target_: diffusion_policy.common.sars_sampler.Indices
  rb_id: default
  key_first_k: {}
  episode_length: 0
  rb_offset: 0
  sequence_length: ${horizon}
  pad_before: 1
  pad_after: 7
  debug: ${debug}


data_directory: /media/dexnex_ssd/data/bnb/

# replay buffer loader entry point
replay_buffer_loader:
  _target_: diffusion_policy.common.replay_buffer_loader.ReplayBufferLoader
  rb_paths:
    block_transfer: ${data_directory}bt.reward.zarr
    bnb_1cam: ${data_directory}1cam.reward.zarr
    bnb_2cams: ${data_directory}2cams.reward.zarr



# training entry point
session_trainer:
  _target_: diffusion_policy.trainers.session_trainer.SessionTrainer
  nb_epochs: 1000
  
  # children
  epoch_trainer:
    _target_: diffusion_policy.trainers.epoch_trainer.EpochTrainer
    nb_batches: 10 # testing

    # children
    step_trainer: 
      _target_: diffusion_policy.trainers.step_trainer.StepTrainer

      # weighted batch loss dict
      w_batch_losses:
        block_transfer: ${common_wbatch_loss}
        bnb_1cam: ${common_wbatch_loss}
        bnb_2cams: ${common_wbatch_loss}

        
override:
  session_trainer:
    epoch_trainer:
      step_trainer: 
        w_batch_losses:
          block_transfer: 
            weight: 0.25
            batch_loss: {batch_loader: {dataset: {sampler: {rb_id: block_transfer }}}}

          bnb_1cam:
            weight: 0.25
            batch_loss: {batch_loader: {dataset: {sampler: {rb_id: bnb_1cam }}}}

          bnb_2cams:
            weight: 0.5
            batch_loss: {batch_loader: {dataset: {sampler: {rb_id: bnb_2cams }}}}