  persistent_workers: false
  pin_memory: true
  shuffle: false

dataset_obs_steps: 2
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

exp_name: default
horizon: 16
keypoint_visible_rate: 1.0

logging:
  group: null
  id: null
  mode: online
  name: polyumi_image_dp_cnn
  project: polyumi_diffusion
  resume: true
  tags:
    - train_diffusion_unet_hybrid
    - polyumi_image

multi_run:
  run_dir: /media/dexnex_ssd/polyumi/dp_outputs/polyumi_image_dp_cnn
  wandb_name_base: polyumi_image_dp_cnn

hydra:
  run:
    dir: /media/dexnex_ssd/polyumi/dp_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${name}_${task_name}
  sweep:
    dir: /media/dexnex_ssd/polyumi/dp_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${name}_${task_name}

n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
name: train_diffusion_unet_hybrid
obs_as_global_cond: true
past_action_visible: false

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.95, 0.999]
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06

policy:
